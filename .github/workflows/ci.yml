name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Create venv and install
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          uv pip install -r requirements.txt
      - name: Run tests
        run: .venv/bin/python -m unittest discover tests
      - name: Run security probe
        run: .venv/bin/python scripts/security_probe.py --skip-live
      - name: Path scrub
        run: .venv/bin/python -m unittest tests.test_gate_round6.GatePathScrub
